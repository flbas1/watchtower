[project]
name = "watchtower"
version = "0.1.0"
description = "Open-source intelligence feeds on a web page of marquees and maps; headless, for a server or container"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "ruamel-yaml>=0.19.1",
    "sgp4>=2.27",
    "h3>=4.5.0",
    "websockets>=17.4",
]

[project.scripts]
watchtower = "watchtower:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
