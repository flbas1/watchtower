  popup.style.display = "none"; popup.replaceChildren();
  applyWaitingData();                                        // data that arrived while it was open
}

function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else e[k] = v;
  }
  for (const c of children) if (c != null) e.append(c);
  return e;
}

function showPopup(anchor, children) {
  popup.replaceChildren(...children.filter(c => c != null));   // left-out lines are null: skip them, don't print "null"
  popup.style.display = "block";
  const a = anchor.getBoundingClientRect();
  const w = popup.offsetWidth, h = popup.offsetHeight;
  let left = Math.min(a.left, innerWidth - w - 8), top = a.bottom + 4;
  if (top + h > innerHeight - 8) top = Math.max(8, a.top - h - 4);
  popup.style.left = Math.max(8, left) + "px";
  popup.style.top = top + "px";
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });
document.addEventListener("mousedown", e => {
  if (popupOpen() && !popup.contains(e.target) && !e.target.closest("#gear, .badge, .map-gear")) closePopup();
});

function speedInput(value, placeholder, onChange) {
  return el("input", { type: "number", min: 1, step: 1, value: value ?? "", placeholder,
                       onchange: e => onChange(e.target.value === "" ? null : Number(e.target.value)) });
}

function feedPicker(current, choose) {
  const search = el("input", { type: "search", placeholder: "Search feeds..." });
  const list = el("div", { class: "picker" });
  const keys = Object.keys(NEWS_FEEDS);
  function fill() {
    const q = search.value.trim().toLowerCase();
    list.replaceChildren(...keys
      .filter(k => !q || k.toLowerCase().includes(q) || feedName(k).toLowerCase().includes(q))
      .map(k => {
        const dim = !stories(k).length;
        return el("div", { class: (k === current ? "current " : "") + (dim ? "dim" : ""),
                           textContent: feedName(k) + (dim ? " (no stories)" : ""),
                           title: NEWS_FEEDS[k].failed ?? feedName(k),
                           onclick: () => choose(k) });
      }));
  }
  search.addEventListener("input", fill);
  fill();
  setTimeout(() => list.querySelector(".current")?.scrollIntoView({ block: "center" }), 0);
  return [search, list];
}

function openRowPopup(index, anchor) {
  const cfg = layout().rows[index];
  if (!cfg) return;
  const again = () => { const badge = allRows().find(r => r.index === index)?.querySelector(".badge"); if (badge) openRowPopup(index, badge); else closePopup(); };
  const edit = fn => { change(l => fn(l.rows[index], l)); again(); };
  const speeds = layout().speeds;
  const modeButton = (mode, text) => el("button", { class: cfg.mode === mode ? "on" : "", textContent: text,
                                                    onclick: () => edit(r => { r.mode = mode; }) });
  const isCrawl = cfg.mode === "crawl";
  showPopup(anchor, [
    el("h3", { textContent: feedName(cfg.feed) }),
    el("div", { class: "line" }, el("label", { textContent: "Marquee" }), modeButton("static", "Static"), modeButton("crawl", "Crawl")),
    el("div", { class: "line" }, el("label", { textContent: "Pinned" }),
       el("button", { class: cfg.pinned ? "on" : "", textContent: cfg.pinned ? "Pinned" : "Not pinned",
                      onclick: () => pinAndFollow(index) })),
    el("div", { class: "line" }, el("label", { textContent: isCrawl ? "Crawl speed" : "Seconds each" }),
       isCrawl
         ? speedInput(cfg.crawlPixelsPerSecond, `${speeds.crawlPixelsPerSecond} (all)`, v => edit(r => { r.crawlPixelsPerSecond = v; }))
         : speedInput(cfg.staticSeconds, `${speeds.staticSeconds} (all)`, v => edit(r => { r.staticSeconds = v; })),
       el("span", { class: "note", textContent: isCrawl ? "px/s, empty = the page's" : "empty = the page's" })),
    el("div", { class: "line" }, el("label", { textContent: "Move" }),
       el("button", { textContent: "↑ Up", onclick: () => moveAndFollow(index, -1) }),
       el("button", { textContent: "↓ Down", onclick: () => moveAndFollow(index, +1) })),
    el("div", { class: "line" }, el("label", { textContent: "Feed" })),
    ...feedPicker(cfg.feed, key => edit(r => { r.feed = key; })),
    el("div", { class: "line" },
       el("button", { class: "danger", textContent: "Delete row",
                      onclick: () => { change(l => { l.rows.splice(index, 1); }); closePopup(); } })),
  ]);
}

// Move / pin a row, then reopen its popup where the row is now (its list index may change).
function moveAndFollow(index, dir) { editAndFollow(index, (l, keep) => moveRow(l, keep, index, dir)); }
function pinAndFollow(index) { editAndFollow(index, (l, keep) => togglePin(l, keep, index)); }
function editAndFollow(index, edit) {
  let now;
  change((l, keep) => { const row = l.rows[index]; edit(l, keep); now = l.rows.indexOf(row); });
  const badge = allRows().find(r => r.index === now)?.querySelector(".badge");
  if (badge) openRowPopup(now, badge); else closePopup();
}

function openPagePopup() {
  const gear = document.getElementById("gear");
  const speeds = layout().speeds;
  const speed = (label, key, note, step = 1) => el("div", { class: "line" }, el("label", { textContent: label }),
    el("input", { type: "number", min: step, step, value: speeds[key],
                  onchange: e => { const v = positive(Number(e.target.value)); if (v) change(l => { l.speeds[key] = v; }); } }),
    el("span", { class: "note", textContent: note }));
  const importer = el("input", { type: "file", accept: ".json,application/json", style: "display:none",
                                 onchange: e => importLayout(e.target.files[0]) });
  showPopup(gear, [
    el("h3", { textContent: "Page settings" }),
    speed("Seconds each", "staticSeconds", "static rows"),
    speed("Slide time", "slideSeconds", "seconds to slide to the next", 0.1),
    speed("Crawl speed", "crawlPixelsPerSecond", "px/s"),
    speed("Roll every", "rollSeconds", "seconds"),
    el("div", { class: "line" }, el("label", { textContent: "Badge width" }),
       el("input", { type: "number", min: 20, step: 1, value: layout().look.badgeWidth,
                     onchange: e => { const v = positive(Number(e.target.value)); if (v) change(l => { l.look.badgeWidth = v; }); } }),
       el("span", { class: "note", textContent: "px, icons and names" })),
    el("div", { class: "line" }, el("label", { textContent: "Icon background" }),
       ...Object.keys(ICON_BACKGROUNDS).map(k => el("button", {
         class: layout().look.iconBackground === k ? "on" : "", textContent: k[0].toUpperCase() + k.slice(1),
         onclick: () => { change(l => { l.look.iconBackground = k; }); openPagePopup(); } }))),
    el("div", { class: "line" }, el("button", { textContent: "Add row", onclick: addRow }),
       el("button", { textContent: "Add map", onclick: addMap })),
    el("div", { class: "line" },
       el("button", { textContent: "Export layout", onclick: exportLayout }),
       el("button", { textContent: "Import layout", onclick: () => importer.click() }), importer),
    el("div", { class: "line" },
       el("button", { class: "danger", textContent: "Reset to default",
                      onclick: () => { if (confirm("Forget this browser's layout and go back to the default?")) resetLayout(); } })),
    el("div", { class: "note", textContent: saved ? `${saved.rows.length} rows, kept in this browser.`
                                                  : "Default layout (nothing changed yet)." }),
  ]);
}
document.getElementById("gear").addEventListener("click", e => { e.stopPropagation(); popupOpen() ? closePopup() : openPagePopup(); });

// A new row goes at the end of the rolling rows, with the first feed that has stories and
// isn't shown yet; its popup opens so the feed can be changed.
function addRow() {
  const used = new Set(layout().rows.map(r => r.feed));
  const keys = Object.keys(NEWS_FEEDS);
  const feed = keys.find(k => !used.has(k) && stories(k).length) ?? keys[0];
  if (!feed) return;
  change((l, keep) => {
    l.rows.push({ feed, mode: "static", pinned: false, slot: null, staticSeconds: null, crawlPixelsPerSecond: null });
    const { free, rolling } = arrange(l.rows, lines);                       // roll it into view, on the last free line
    if (rolling.length > free.length) keep.top = l.rows[rolling[rolling.length - free.length]];
  });
  const index = layout().rows.length - 1;
  const badge = allRows().find(r => r.index === index)?.querySelector(".badge");
  openRowPopup(index, badge ?? document.getElementById("gear"));
}

function exportLayout() {
  const blob = new Blob([JSON.stringify(layout(), null, 2)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "osint-web-layout.json" });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importLayout(file) {
  if (!file) return;
  file.text().then(text => {
    let layout;
    try { layout = normalise(JSON.parse(text)); } catch { alert("That file isn't a layout (not JSON)."); return; }
    if (!layout.rows.length) { alert("That file has no rows."); return; }
    change(l => { l.speeds = layout.speeds; l.look = layout.look; l.rows = layout.rows; l.maps = layout.maps; });
    closePopup();
  });
}

function resetLayout() {
  try { localStorage.removeItem(STORE_KEY); } catch {}
  saved = null;
  topRolling = 0;
  closePopup();
  render();
}

// =============================================================================
// Start, and keep up to date
// =============================================================================
function showMessage(html) {
  let m = document.getElementById("message");
  if (!html) { m?.remove(); return; }
  if (!m) { m = document.createElement("div"); m.id = "message"; screen.prepend(m); }
  m.innerHTML = html;
}

// Maps saved when rain had its own On/Off switch: their rain feeds start unticked (Chris,
// 2026-11-19). Needs geo.js to know which feeds are rain, so it runs once geo.js has loaded.
function untickRainOnOldMaps() {
  if (!saved?.maps.some(m => m.oldRain)) return;
  change(l => { for (const m of l.maps) { if (m.oldRain) m.feeds = m.feeds.filter(k => !isRainFeed(k)); delete m.oldRain; } });
}

let firstLoad = true;
async function refresh() {
  const news = await loadNews();
  if (!news) {
    showMessage("No <code>news.js</code> next to this page yet. In osint's config.yml set " +
                "<code>web: news_file:</code> to this folder's <code>news.js</code> and start osint.");
    return;
  }
  const defaultBefore = JSON.stringify(defaultLayout().rows);
  NEWS_FEEDS = news.feeds;
  showMessage(Object.values(NEWS_FEEDS).some(f => f.stories.length) ? "" : "osint hasn't fetched any feeds yet.");
  const geo = await loadScript("geo.js", "GEO");   // small; read even with no maps, so Add map knows the feeds
  const geoNew = geo && geo.updated !== geoUpdated;
  if (geo) { GEO = geo; geoUpdated = geo.updated; untickRainOnOldMaps(); }
  if (firstLoad) { firstLoad = false; render(); }
  else {
    refreshRows(defaultBefore);
    if (geoNew) geoChanged();
  }
}

saved = loadSaved();          // here, once every constant above exists
refresh();
setInterval(refresh, RELOAD_SECONDS * 1000);
setInterval(redrawMaps, SUN_REDRAW_SECONDS * 1000);      // the night side moves

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    renderMaps(layoutPage());                          // docked sizes are % of the window
    if (linesThatFit() !== lines) renderRows();
  }, 150);
});
</script>
